name: Release

# Publishing a GitHub release uploads both packages to PyPI: fastdrc (the tool) and
# fastdrc-gf180mcu (the deck). A version that is already there is left alone, so to
# release one of the two, raise its version alone.
#
# No password is kept here: PyPI trusts this workflow ("trusted publishing"). Each of
# the two PyPI projects names it as its publisher -- owner edacommons, repository
# FastDRC, workflow release.yml, environment pypi.

on:
  release:
    types: [published]
  workflow_dispatch:        # by hand, from the Actions page: to repeat an upload that did not go through

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Test
        run: |
          uv sync
          uv run pytest -q
      - name: Build
        run: |
          uv build --package fastdrc -o dist/fastdrc
          uv build --package fastdrc-gf180mcu -o dist/fastdrc-gf180mcu
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  fastdrc:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/fastdrc
          skip-existing: true

  fastdrc-gf180mcu:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/fastdrc-gf180mcu
          skip-existing: true
