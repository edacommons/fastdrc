[build-system]
requires = ["hatchling >=1.24"]
build-backend = "hatchling.build"

[project]
name = "fastdrc"
version = "0.0.1"
description = "Design rules (DRC) drawn by example and compiled to a working KLayout deck"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "Apache-2.0"
authors = [{ email = "s.rabykin@gmail.com" }]
keywords = ["EDA", "DRC", "design-rule-check", "IC", "PCB", "layout"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[dependency-groups]
# rawast: cross-checks the constraint grammar in the tests; the GF180MCU deck is tested here too
dev = ["pytest>=8", "rawast>=0.1.1", "fastdrc-gf180mcu"]

# the GF180MCU deck is a package of its own, kept in this repository
[tool.uv.workspace]
members = ["fastdrc-gf180mcu"]

[tool.uv.sources]
fastdrc = { workspace = true }
fastdrc-gf180mcu = { workspace = true }

[project.scripts]
fastdrc = "fastdrc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["python/fastdrc"]

[tool.hatch.build.targets.sdist]
exclude = ["/build", "/private", "/fastdrc-gf180mcu", "/docs/gf180mcu", "/docs/sky130", "/docs/ihp", "/docs/fp45"]

[tool.pytest.ini_options]
testpaths = ["tests"]
