[build-system]
requires = ["scikit-build-core >=0.10", "nanobind >=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "fastdrc"
version = "0.0.1"
description = "Fast design-rule-check (DRC) engine for IC/PCB layout — C++ with Python bindings"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["doit>=0.36"]
license = "Apache-2.0"
authors = [{ email = "s.rabykin@gmail.com" }]
keywords = ["EDA", "DRC", "design-rule-check", "IC", "PCB", "layout"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.scripts]
fastdrc = "fastdrc.cli:main"

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/fastdrc"]

# Compile only the Python module (not the C++ test suite) inside the wheel.
[tool.scikit-build.cmake.define]
FASTDRC_BUILD_PYTHON = "ON"
FASTDRC_BUILD_TESTS = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests"]
