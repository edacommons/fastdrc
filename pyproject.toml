# The Python package is PURE PYTHON: `pip install` needs no compiler. The C++ core is
# built separately with CMake (README, "Build the C++ core") and is not in the wheel.
[build-system]
requires = ["hatchling >=1.24"]
build-backend = "hatchling.build"

[project]
name = "fastdrc"
version = "0.0.1"
description = "Design rules (DRC) drawn by example and compiled to a working KLayout deck"
readme = "README.md"
requires-python = ">=3.11"       # tomllib (CLI + flow configs)
dependencies = [
  "doit>=0.36",                  # the deck flow runner
]
license = "Apache-2.0"
authors = [{ email = "s.rabykin@gmail.com" }]
keywords = ["EDA", "DRC", "design-rule-check", "IC", "PCB", "layout"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.optional-dependencies]
gds = ["rawast>=0.1.1"]          # GDSII reader, only for `fastdrc compose`

[dependency-groups]
dev = ["pytest>=8", "rawast>=0.1.1", "nanobind>=2.0"]   # nanobind: only to build the C++ core

[project.scripts]
fastdrc = "fastdrc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["python/fastdrc"]
# a core built in place for development (python/fastdrc/_fastdrc.*.so) stays out of the wheel
exclude = ["*.so", "*.pyd", "*.dylib"]

[tool.hatch.build.targets.sdist]
exclude = ["/build", "/docs/gf180mcu", "/docs/sky130", "/docs/ihp", "/docs/fp45", "*.so", "*.pyd", "*.dylib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
