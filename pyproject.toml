[build-system]
requires = ["hatchling >=1.24"]
build-backend = "hatchling.build"

[project]
name = "fastdrc"
version = "0.0.3"
description = "Design rules (DRC) drawn by example and compiled for any checking tool through backend plugins. KLayout backend included."
dynamic = ["readme"]          # README.md, its links made full addresses: hatch_build.py
requires-python = ">=3.11"
dependencies = []
license = "Apache-2.0"
authors = [{ email = "s.rabykin@gmail.com" }]
keywords = ["EDA", "DRC", "design-rule-check", "IC", "PCB", "layout"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Homepage = "https://github.com/edacommons/FastDRC"
Documentation = "https://github.com/edacommons/FastDRC/blob/main/docs/from-a-manual.md"
Issues = "https://github.com/edacommons/FastDRC/issues"

[tool.hatch.metadata.hooks.custom]

[dependency-groups]
# rawast: cross-checks the constraint grammar in the tests; the GF180MCU deck and the gdscheck backend are tested here too
dev = ["pytest>=8", "rawast>=0.1.1", "fastdrc-gf180mcu", "fastdrc-gdscheck"]

# the GF180MCU deck and the gdscheck backend are packages of their own, kept in this repository
[tool.uv.workspace]
members = ["fastdrc-gf180mcu", "fastdrc-gdscheck"]

[tool.uv.sources]
fastdrc = { workspace = true }
fastdrc-gf180mcu = { workspace = true }
fastdrc-gdscheck = { workspace = true }

[project.scripts]
fastdrc = "fastdrc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["python/fastdrc"]

[tool.hatch.build.targets.sdist]
exclude = ["/build", "/private", "/fastdrc-gf180mcu", "/fastdrc-gdscheck", "/docs/gf180mcu", "/docs/sky130", "/docs/ihp", "/docs/fp45"]

[tool.pytest.ini_options]
testpaths = ["tests"]
